<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure PHP API Frontend</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 mb-4">
                    <h3>Login</h3>
                    <div class="mb-3">
                        <input type="email" id="email" class="form-control" placeholder="Email" value="test@example.com">
                    </div>
                    <div class="mb-3">
                        <input type="password" id="password" class="form-control" placeholder="Password" value="password123">
                    </div>
                    <button id="loginBtn" class="btn btn-primary w-100">Login</button>
                </div>

                <div id="secureArea" class="card p-4 ">
                    <h3>Secure Request</h3>
                    <p class="text-muted small">Payload will be encrypted before sending.</p>
                    <div class="mb-3">
                        <input type="text" id="payloadData" class="form-control" placeholder="Data to send securely" value="Hello Server!">
                    </div>
                    <button id="fetchBtn" class="btn btn-success w-100">Fetch Secure Data</button>
                    
                    <div class="mt-4">
                        <h5>Response:</h5>
                        <pre id="responseBox" class="bg-light p-3 border"></pre>
                    </div>

                    <button id="logoutBtn" class="btn btn-danger w-100 mt-3">Logout</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
