<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SSP Institute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Institute Login</h3>
    
    <div id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Username</label>
            <input type="text" class="form-control" id="email" placeholder="Enter username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password">
        </div>
        
        <div class="mb-3">
            <img id="captchaImage" src="" alt="CAPTCHA" class="mb-2" style="cursor:pointer;" title="Click to refresh">
            <input type="text" class="form-control" id="captcha" placeholder="Enter CAPTCHA">
            <input type="hidden" id="captchaToken">
        </div>

        <button id="loginBtn" class="btn btn-primary w-100">Login</button>
    </div>

    <div id="portalLoading" class="text-center d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Logging you in via data...</p>
    </div>

    <div id="secureArea" class="mt-4 d-none text-center">
        <div class="alert alert-success">You are logged in!</div>
        <a href="index.html" class="btn btn-success">Go to Dashboard</a>
        <button id="logoutBtn" class="btn btn-danger mt-2">Logout</button>
    </div>
</div>

<script src="js/global.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
