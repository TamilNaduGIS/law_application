  <body>
    <div class="login-card">
      <div class="login-header">
        <h1>Applicant Login</h1>
        <p>High Court of Madras — Law Officers Recruitment</p>
      </div>
      <div class="login-body">
        <div id="successMsg" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm">
            <label for="enrolmentNumber">Bar Council Enrolment No. <span class="mandatory">*</span></label>

            <label for="mobileNumber">Mobile Number <span class="mandatory">*</span></label>
            <input type="text" id="mobileNumber"placeholder="Enter mobile number" maxlength="10" required>
            <button type="submit" class="btn-primary">Get OTP</button>
            <div class="text-center mt-3">

        </form>
        <a href="index.html" class="back-home">← Back to Home</a>
      </div>
    </div>
    <!-- OTP Modal -->
<div class="modal fade" id="otpModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header">
                <h5 class="modal-title"> Verify OTP </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"> </button>
            </div>

            <div class="modal-body">
                <p class="text-muted mb-3">
                    OTP has been sent to your registered mobile number.
                </p>

                <div class="d-flex justify-content-center gap-2 mb-3">

                    <input type="text" maxlength="1" class="otp-box form-control text-center">

                    <input type="text" maxlength="1" class="otp-box form-control text-center">

                    <input type="text" maxlength="1" class="otp-box form-control text-center">

                    <input type="text" maxlength="1" class="otp-box form-control text-center">

                    <input type="text" maxlength="1" class="otp-box form-control text-center">

                    <input type="text" maxlength="1" class="otp-box form-control text-center">

                </div>

                <div class="text-center">

                    <span id="timerText">
                        Resend OTP in 60s
                    </span>

                    <br>

                    <button
                        id="resendBtn"
                        class="btn btn-link p-0 mt-2"
                        style="display:none;">
                        Resend OTP
                    </button>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-primary w-100"

                    Verify OTP

            </div>

        </div>

</div>
    <!-- otp modal -->


     <!-- JS -->
    <script src="assets/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="assets/vendor/bootstrap-js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="./assets/js/helper.js"></script>


    <script>
        $(document).ready(function(){
            applyInputValidation('enrolmentNumber', [11]);
            applyInputValidation('mobileNumber', [3]);
        })

      const otpModal =
    new bootstrap.Modal(
        document.getElementById('otpModal')
    );

let generatedOtp = "123456";
let timer;
let countdown = 60;

document
.getElementById('loginForm')
.addEventListener('submit', function(e){

    e.preventDefault();

    const mobile =
        document.getElementById('mobileNumber')
        .value.trim();

    if(!/^[6-9]\d{9}$/.test(mobile))
    {
        showError(
            "Enter valid mobile number"
        );
        return;
    }

    otpModal.show();

    startOtpTimer();
});

function showError(message){

    const errorEl =
        document.getElementById('errorMsg');

    errorEl.textContent = message;
    errorEl.style.display = 'block';
}

const otpInputs =
document.querySelectorAll('.otp-box');

otpInputs.forEach((input,index)=>{

    input.addEventListener('input',()=>{

        if(input.value.length===1 &&
           otpInputs[index+1]){

            otpInputs[index+1].focus();
        }
    });

    input.addEventListener('keydown',(e)=>{

        if(e.key==="Backspace" &&
           !input.value &&
           otpInputs[index-1]){

            otpInputs[index-1].focus();
        }
    });

});

function startOtpTimer(){

    clearInterval(timer);

    countdown = 60;

    document.getElementById(
        'resendBtn'
    ).style.display='none';

    timer =
    setInterval(()=>{

        countdown--;

        document.getElementById(
            'timerText'
        ).innerHTML =
        `Resend OTP in ${countdown}s`;

        if(countdown<=0){

            clearInterval(timer);

            document.getElementById(
                'timerText'
            ).innerHTML='';

            document.getElementById(
                'resendBtn'
            ).style.display='inline-block';
        }

    },1000);
}

document
.getElementById('resendBtn')
.addEventListener('click',()=>{

    generatedOtp = "123456";

    startOtpTimer();

    alert(
        "OTP resent successfully"
    );
});

document
.getElementById('verifyOtpBtn')
.addEventListener('click',()=>{

    let enteredOtp = '';

    document
    .querySelectorAll('.otp-box')
    .forEach(box=>{

        enteredOtp += box.value;
    });

    if(enteredOtp !== generatedOtp){

        alert("Invalid OTP");
        return;
    }

    window.location.href =
        'dashboard.html';
});
    </script>


  </body>
</html>
