<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Login | Law Officers Recruitment</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <!-- <link rel="stylesheet" href="font/bootstrap-icons.min.css"> -->
    <!-- Bootstrap + Icons -->
    <link href="assets/vendor/bootstrap-css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        .mandatory {
            color: red;
            font-weight: bold;
        }
        .otp-box{
                width:50px;
                height:55px;
                font-size:22px;
                font-weight:600;
            }

.modal-content{
    border-radius:16px;
}
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      }
      .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      }
      .login-header {
      background: #1f3291;
      color: white;
      padding: 1.25rem 1.5rem;
      }
      .login-header h1 { font-size: 1.25rem; font-weight: 600; }
      .login-header p { font-size: 0.8rem; opacity: 0.9; margin-top: 0.25rem; }
      .login-body { padding: 1.75rem 1.5rem; }
      label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: #1f3291; font-size: 0.9rem; }
      input {
      width: 100%;
      height: 48px;
      border: 1px solid #d7d7d7;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 15px;
      margin-bottom: 1.1rem;
      }
      input:focus { border-color: #1f3291; outline: none; }
      .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: #1f3291;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      }
      .btn-primary:hover { background: #16256d; }
      .links {
      display: flex;
      justify-content: space-between;
      margin: 0.5rem 0 1.25rem;
      font-size: 0.85rem;
      }
      .links a { color: #1f3291; text-decoration: none; font-weight: 500; }
      .links a:hover { text-decoration: underline; }
      .back-home {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #64748b;
      font-size: 0.85rem;
      text-decoration: none;
      }
      .error-msg, .success-msg {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      }
      .error-msg { background: #fee2e2; color: #b91c1c; }
      .success-msg { background: #dcfce7; color: #15803d; }
      .demo-hint {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #475569;
      border-left: 4px solid #1f3291;
      }
      .register-link{
    color:#1f3291;
    font-weight:600;
    text-decoration:none;
}

.register-link:hover{
    text-decoration:underline;
}
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <h1>Applicant Login</h1>
        <p>High Court of Madras — Law Officers Recruitment</p>
      </div>
      <div class="login-body">
        <div id="successMsg" class="success-msg"></div>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm" novalidate>
            <label for="enrolmentNumber">Bar Council Enrolment No. <span class="mandatory">*</span></label>
            <input type="text" id="enrolmentNumber" placeholder="e.g. MS/1234/2015" required autocomplete="username">
            <label for="mobileNumber">Mobile Number <span class="mandatory">*</span></label>
            <input type="tel" id="mobileNumber" placeholder="Enter mobile number" maxlength="10" required>
            <button type="submit" class="btn-primary">Get OTP</button>
            <div class="text-center mt-3">
                <span class="text-muted">New Applicant?</span>
                <a href="sign-up.html" class="register-link"> Create Account</a>
            </div>
        </form>
        <a href="index.html" class="back-home">← Back to Home</a>
      </div>
    </div>
    <!-- OTP Modal -->
<div class="modal fade" id="otpModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header">
                <h5 class="modal-title"> Verify OTP </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"> </button>
            </div>

            <div class="modal-body">
                <p class="text-muted mb-3">
                    OTP has been sent to your registered mobile number.
                </p>

                <div class="d-flex justify-content-center gap-2 mb-3">

                    <input id="otpbox1" id="otpbox1" type="text" maxlength="1" class="otp-box form-control text-center">

                    <input id="otpbox2" type="text" maxlength="1" class="otp-box form-control text-center">

                    <input id="otpbox3" type="text" maxlength="1" class="otp-box form-control text-center">

                    <input id="otpbox4" type="text" maxlength="1" class="otp-box form-control text-center">

                    <input id="otpbox5" type="text" maxlength="1" class="otp-box form-control text-center">

                    <input id="otpbox6" type="text" maxlength="1" class="otp-box form-control text-center">

                </div>

                <div class="text-center">

                    <span id="timerText">Resend OTP in 300s</span>

                    <br>

                    <button
                        id="resendBtn"
                        class="btn btn-link p-0 mt-2"
                        style="display:none;">
                        Resend OTP
                    </button>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-primary w-100"
                    id="verifyOtpBtn">

                    Verify OTP

                </button>

            </div>

        </div>
    </div>
</div>
    <!-- otp modal -->


     <!-- JS -->
    <script src="assets/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="assets/vendor/bootstrap-js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/portal-alert.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="assets/js/secure-api.js"></script>
    <script src="assets/js/law-portal-api.js"></script>
    <script src="assets/js/helper.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
